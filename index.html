<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA — Modern Business</title>
  <meta name="description" content="NOVA is a modern business providing quality products and professional services.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --text: #ffffff;
      --muted: #a6a6b3;
      --accent: #7c5cff;
      --accent2: #00d4ff;
      --border: rgba(255,255,255,0.09);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAVBAR */

    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(10,10,15,0.82);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
    }

    nav {
      max-width: 1150px;
      margin: auto;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: #ddd;
      font-size: 14px;
      transition: .3s;
    }

    .nav-links a:hover {
      color: white;
    }

    .menu-btn {
      display: none;
      font-size: 25px;
      cursor: pointer;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 20px 70px;
      background:
        radial-gradient(circle at 80% 30%, rgba(124,92,255,.25), transparent 30%),
        radial-gradient(circle at 20% 70%, rgba(0,212,255,.12), transparent 25%);
    }

    .hero-content {
      max-width: 1150px;
      width: 100%;
      margin: auto;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: rgba(255,255,255,.04);
      color: #cfcfff;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .hero h1 {
      max-width: 800px;
      font-size: clamp(45px, 8vw, 82px);
      line-height: 1.02;
      letter-spacing: -3px;
      margin-bottom: 22px;
    }

    .gradient {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 650px;
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      gap: 13px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 13px 21px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      transition: .3s;
    }
